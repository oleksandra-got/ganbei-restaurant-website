<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ganbei restaurant</title>
</head>
<body>
    <header>
        <a href="#"><img src="./media/logo.png" alt="Ganbei Logo"></a>

        <nav>
            <a href="#">About us</a>
            <a href="#">Menu</a>
            <a href="#">Gallery</a>
            <a href="#">Restaurants</a>
            <a href="#">Contacts</a>
            <a href="#">ORDER ONLINE</a>
        </nav>
        <div class="header-actions">
            <div class="language-selector">
                <label for="language"></label>
                <select id="language">
                    <option value="en" selected>EN</option>
                    <option value="lv">LV</option>
                    <option value="ge">GE</option>
                </select>
            </div>
    </header>
    <section class="hero">
        <img src="./media/logo.png" alt="Ganbei Big Logo" class="hero-logo">
        <h1 class="hero-subtitle">MODERN ASIAN RESTAURANT</h1>
        <a href="#" class="btn">BOOK A TABLE</a>
    </section>
    <div class="reservation-modal">
        <div class="reservation-box">
            <button class="close-btn">&times;</button>
            <h2>BOOK A TABLE</h2>
            <form id="reservation-form">
                <div class="reservation-grid">
                    <!---Linie 1:Name/Guests-->
                    <div class="form-group">
                     <label for="name">Name:</label>
                     <input type="text" id="name" name="name" required>
                    </div>
                <div class="form-group">
                    <select id="guests" name="guests" required>
                    <option value="">Amount of people</option>
                    <option value="1">1 person</option>
                    <option value="2">2 people</option>
                    <option value="3">3 people</option>
                    <option value="4">4 people</option>
                    <option value="5">5 people</option>
                    </select>
                </div>
                
                <!---Linie 2:Phone/Date.Time-->
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group datetime-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" required>

                    <label for="time">Time</label>
                <select id="time" name="time" required>
                    <option value="">Choose time</option>
                    <option value="18:00">18:00</option>
                    <option value="18:30">18:30</option>
                    <option value="19:00">19:00</option>
                    <option value="19:30">19:30</option>
                    <option value="20:00">20:00</option>
                </select>
                </div>

                <!---Linie 3:Location/Requests-->
                <div class="form-group">
                    <label for="location">Location</label>
                <select id="location" name="location" required>
                    <option value="">Choose a restoraunt</option>
                    <option value="akropole-riga">Akropole Riga</option>
                    <option value="galeria-riga">Galeria Riga</option>
                    <option value="origo-riga">Origo Riga</option>
                </select>
                </div>

                <div class="form-group">
                    <label for="special-requests">Special Requests:</label>
                    <textarea id="special-requests" name="special-requests"></textarea>
                </div>
                </div>
                
                <div class="privacy-check">
                    <input type="checkbox" id="privacy" name="privacy" required>
                    <label for="privacy">
                        By submitting this form I agree to the
                        <a href="#">Privacy Policy</a>
                    </label>
                </div>
                <button type="submit" class="btn">CONFIRM</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
